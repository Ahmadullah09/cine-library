<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cine Diary</title>
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('cd_theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#fafafa; --fg:#141414; --mute:#8a8a8a; --line:#e7e7e7; --card:#ffffff; --hover:#f1f1f1;
  --font:"Futura","Futura PT","Jost","Century Gothic","Trebuchet MS",sans-serif;
}
[data-theme="dark"]{
  --bg:#0e0e0e; --fg:#ededed; --mute:#7d7d7d; --line:#262626; --card:#151515; --hover:#1c1c1c;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;font-size:15px;line-height:1.5;
  letter-spacing:.01em;transition:background .25s,color .25s;min-height:100vh}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
sup{font-size:.7em;color:var(--mute);margin-left:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(16px,4vw,48px);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:500;font-size:15px;letter-spacing:.32em;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{padding:7px 12px;border-radius:999px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);transition:.15s}
.tbtn:hover{color:var(--fg);background:var(--hover)}
.pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12px;color:var(--mute);border:1px solid var(--line)}
.pill:hover{color:var(--fg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.pill[data-s="synced"] .dot{background:#3fa37a}
.pill[data-s="saving"] .dot{background:#e0a030;animation:pulse 1s infinite}
.pill[data-s="error"] .dot,.pill[data-s="reconnect"] .dot{background:#d6534f}
@keyframes pulse{50%{opacity:.3}}
.theme svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;display:block}
[data-theme="light"] .sun{display:none}
[data-theme="dark"] .moon{display:none}

/* layout */
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1280px;margin:0 auto}
.tabs{display:flex;gap:28px;margin-bottom:6px}
.tabs button{font-size:26px;font-weight:300;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent;transition:.15s}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.tabs button:hover{color:var(--fg)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.subtabs button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;letter-spacing:.06em;color:var(--mute);transition:.15s}
.subtabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subtabs button:not(.on):hover{color:var(--fg);background:var(--hover)}
.subtabs button.on sup{color:inherit;opacity:.6}
.bar{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.bar input,.bar select,.field,select.field{background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;outline:0;border-radius:0;transition:border-color .15s}
.bar input{flex:1;min-width:140px}
.bar input:focus,.field:focus{border-color:var(--fg)}
.bar select{color:var(--mute);cursor:pointer}
select option{background:var(--card);color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:28px 20px}
.card{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.poster{aspect-ratio:2/3;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--mute);font-size:12px;text-align:center;padding:10px;transition:transform .2s}
.card:hover .poster{transform:translateY(-3px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:14px;font-weight:500;line-height:1.3}
.card .sub{font-size:12px;color:var(--mute);margin-top:-6px}
.ghost{align-self:flex-start;font-size:12px;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line);padding:2px 0}
.ghost:hover{color:var(--fg);border-color:var(--fg)}
.empty{color:var(--mute);text-align:center;padding:80px 0;font-weight:300;font-size:18px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px;overflow-y:auto;z-index:20}
.modal[hidden]{display:none}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%;max-width:880px;padding:clamp(20px,4vw,40px);position:relative}
.panel.narrow{max-width:560px}
.x{position:absolute;top:14px;right:18px;font-size:26px;color:var(--mute);line-height:1}
.x:hover{color:var(--fg)}
.panel h2{font-weight:300;font-size:28px;line-height:1.2;margin-bottom:4px}
.panel h4{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px}
.detail{display:grid;grid-template-columns:240px 1fr;gap:34px}
@media(max-width:700px){.detail{grid-template-columns:1fr}.dposter{max-width:220px}}
.dposter .poster{width:100%}
.sub2{color:var(--mute);font-size:13px;margin-bottom:12px}
.plot{font-weight:300;font-size:15px;margin:14px 0}
dl{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:13px}
dt{color:var(--mute)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:13px}
.chip b{display:block;font-weight:500;font-size:18px;line-height:1.2}
.chip span{color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.rate{display:grid;grid-template-columns:130px 1fr 38px;gap:12px;align-items:center;margin:8px 0;font-size:13px}
.rate output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
input[type=range].unset{opacity:.35}
.avg{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.avg b{font-size:44px;font-weight:300;line-height:1}
.avg span{color:var(--mute);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.btn{padding:9px 18px;border-radius:999px;border:1px solid var(--fg);font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:.15s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover{opacity:.8}
.btn.soft{border-color:var(--line);color:var(--mute)}
.btn.soft:hover{color:var(--fg);background:var(--hover)}
.danger{color:#d6534f}
.danger:hover{background:#d6534f;color:#fff;border-color:#d6534f}
.linkbtn{font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.linkbtn:hover{color:var(--fg)}

/* add */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.pills button{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.pills button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sform{display:flex;gap:12px;align-items:flex-end}
.sform .field{flex:1}
.res{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res .poster{width:44px;aspect-ratio:2/3;padding:0;font-size:9px;border-radius:2px}
.res .t{font-size:14px;line-height:1.3}
.res .y{font-size:12px;color:var(--mute)}
.res .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.res .btns button{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.res .btns button:hover{color:var(--fg);border-color:var(--fg)}
.have{font-size:12px;color:var(--mute)}
.msg{color:var(--mute);padding:22px 0;font-size:14px}
.more{margin:18px auto 0;display:block}

/* settings */
.set label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:20px 0 4px}
.set .field{width:100%}
.note{font-size:12px;color:var(--mute);margin-top:6px;font-weight:300}
.note a{color:inherit}
.warn{border:1px solid #d6534f;color:#d6534f;border-radius:4px;padding:10px 12px;font-size:12px;margin-top:16px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Cine Diary</div>
  <div class="tools">
    <button id="syncPill" class="pill" data-s="off" title="Google Drive sync"><i class="dot"></i><span>Drive: off</span></button>
    <button id="addBtn" class="tbtn">+ Add</button>
    <button id="setBtn" class="tbtn">Settings</button>
    <button id="themeBtn" class="tbtn theme" aria-label="Toggle light / dark mode">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <nav class="tabs" id="statusTabs"></nav>
  <nav class="subtabs" id="catTabs"></nav>
  <div class="bar">
    <input id="filter" placeholder="Filter this list…" autocomplete="off">
    <select id="sort">
      <option value="added">Recently added</option>
      <option value="watched">Recently watched</option>
      <option value="title">Title</option>
      <option value="year">Year</option>
      <option value="mine">My rating</option>
      <option value="imdb">IMDb rating</option>
    </select>
  </div>
  <section id="grid" class="grid"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<div id="modal" class="modal" hidden><div class="panel" id="panel"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ───────── helpers ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const real = v => v && v !== 'N/A';

const CATS = [['movie','Movies'],['series','TV Series'],['animemovie','Anime Movies'],['animeseries','Anime Series']];
const ASPECTS = [['plot','Plot'],['cast','Cast'],['world','World-building'],['sound','Soundtrack'],['cine','Cinematography'],['impact','Impact']];
const catType = c => (c === 'movie' || c === 'animemovie') ? 'movie' : 'series';
const catLabel = c => (CATS.find(x => x[0] === c) || [,c])[1];

let settings = load('cd_settings', { omdbKey: '', clientId: '' });
let items    = load('cd_items', []);
let ui       = load('cd_ui', { status: 'watchlist', cat: 'movie', sort: 'added' });
ui.q = '';

const el = {
  syncPill: $('#syncPill'),
  addBtn: $('#addBtn'),
  setBtn: $('#setBtn'),
  statusTabs: $('#statusTabs'),
  catTabs: $('#catTabs'),
  filter: $('#filter'),
  sort: $('#sort'),
  grid: $('#grid'),
  empty: $('#empty'),
  modal: $('#modal'),
  panel: $('#panel'),
  toast: $('#toast')
};
const SYNC_LABELS = {
  off: 'Drive: off',
  saving: 'Syncing…',
  synced: 'Saved to Drive',
  error: 'Sync failed',
  reconnect: 'Reconnect Drive'
};

function avg(r) {
  const v = ASPECTS.map(([k]) => r && r[k]).filter(x => typeof x === 'number');
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function toast(msg) {
  el.toast.textContent = msg; el.toast.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.toast.classList.remove('show'), 2400);
}
function poster(it) {
  const p = it.poster || (it.omdb && it.omdb.Poster);
  return real(p) ? `<img src="${esc(p)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span>${esc(it.title)}</span>`;
}

/* ───────── theme ───────── */
$('#themeBtn').onclick = () => {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n; localStorage.setItem('cd_theme', n);
};

/* ───────── persistence + Google Drive sync ───────── */
function persist() { store('cd_items', items); queuePush(); }
function touch(it) { it.updatedAt = Date.now(); persist(); }

const DRIVE_FILE = 'cine-diary.json';
let tokenClient = null, accessToken = null, tokenExp = 0, pending = null, fileId = null, pushTimer = null;
const driveOn = () => !!(settings.clientId && localStorage.getItem('cd_drive') === '1');

function setSync(s) {
  el.syncPill.dataset.s = s;
  el.syncPill.querySelector('span').textContent = SYNC_LABELS[s];
}
function initGoogle() {
  if (tokenClient) return true;
  if (!settings.clientId || !(window.google && google.accounts)) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: settings.clientId,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: r => {
      if (!pending) return;
      if (r.error) { pending.rej(Object.assign(new Error(r.error), { needAuth: true })); }
      else { accessToken = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000; pending.res(accessToken); }
      pending = null;
    },
    error_callback: e => { if (pending) { pending.rej(Object.assign(new Error(e.type || 'auth'), { needAuth: true })); pending = null; } }
  });
  return true;
}
function getToken(interactive) {
  return new Promise((res, rej) => {
    if (accessToken && Date.now() < tokenExp - 60000) return res(accessToken);
    if (!initGoogle()) return rej(Object.assign(new Error('Google not ready'), { needAuth: true }));
    pending = { res, rej };
    tokenClient.requestAccessToken({ prompt: interactive ? '' : 'none' });
  });
}
async function drive(path, opts = {}) {
  const t = await getToken(false);
  const r = await fetch('https://www.googleapis.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + t, ...(opts.headers || {}) } });
  if (r.status === 401) { accessToken = null; throw Object.assign(new Error('expired'), { needAuth: true }); }
  if (!r.ok) throw Object.assign(new Error('Drive ' + r.status), { status: r.status });
  return r;
}
async function findFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j = await (await drive(`/drive/v3/files?q=${q}&fields=files(id)`)).json();
  fileId = j.files && j.files[0] ? j.files[0].id : null;
  return fileId;
}
async function writeRemote(body) {
  if (fileId) {
    try { await drive(`/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return; }
    catch (e) { if (e.status !== 404) throw e; fileId = null; }
  }
  const b = 'cdboundary';
  const multipart = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n` +
                    `--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const r = await drive('/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: multipart });
  fileId = (await r.json()).id;
}
function queuePush() {
  if (!driveOn()) return setSync('off');
  setSync('saving'); clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500);
}
async function push() {
  try { await getToken(false); if (!fileId) await findFile(); await writeRemote(JSON.stringify({ app: 'cine-diary', version: 1, items })); setSync('synced'); }
  catch (e) { console.warn('push', e); setSync(e.needAuth ? 'reconnect' : 'error'); }
}
function merge(a, b) {
  const m = new Map();
  [...a, ...b].forEach(x => { const o = m.get(x.id); if (!o || (x.updatedAt || 0) > (o.updatedAt || 0)) m.set(x.id, x); });
  return [...m.values()];
}
async function pull() {
  setSync('saving');
  try {
    await getToken(false);
    if (await findFile()) {
      let remote = {}; try { remote = await (await drive(`/drive/v3/files/${fileId}?alt=media`)).json(); } catch {}
      items = merge(items, remote.items || []); store('cd_items', items); render();
    }
    await push();
  } catch (e) { console.warn('pull', e); setSync(e.needAuth ? 'reconnect' : 'error'); }
}
async function connectDrive() {
  if (!settings.clientId) { toast('Add your Google Client ID in Settings first'); return openSettings(); }
  if (location.protocol === 'file:') { toast('Open the site via http://localhost (see README)'); return; }
  if (!initGoogle()) return toast('Google script not loaded — check your internet');
  try { await getToken(true); localStorage.setItem('cd_drive', '1'); await pull(); toast('Google Drive connected'); }
  catch (e) { console.warn(e); setSync('error'); toast('Could not connect to Google Drive'); }
}
function disconnectDrive() {
  if (accessToken && window.google) try { google.accounts.oauth2.revoke(accessToken); } catch {}
  accessToken = null; fileId = null; localStorage.removeItem('cd_drive'); setSync('off'); toast('Drive disconnected');
}
el.syncPill.onclick = () => {
  const s = el.syncPill.dataset.s;
  if (!driveOn()) return openSettings();
  if (s === 'reconnect' || s === 'error') return connectDrive();
  pull().then(() => toast('Synced'));
};

/* ───────── OMDb ───────── */
async function omdb(params) {
  const u = new URL('https://www.omdbapi.com/');
  u.search = new URLSearchParams({ apikey: settings.omdbKey, ...params });
  const r = await fetch(u); return r.json();
}

/* ───────── main render ───────── */
function render() {
  const live = items.filter(i => !i.deleted);
  const statusCount = {
    watchlist: live.filter(i => i.status === 'watchlist').length,
    watched: live.filter(i => i.status === 'watched').length
  };
  const catCount = Object.fromEntries(CATS.map(([k]) => [k, live.filter(i => i.status === ui.status && i.category === k).length]));

  el.statusTabs.innerHTML = ['watchlist', 'watched'].map(s =>
    `<button class="${ui.status === s ? 'on' : ''}" data-status="${s}">${s === 'watchlist' ? 'Watchlist' : 'Watched'}<sup>${statusCount[s]}</sup></button>`).join('');
  el.catTabs.innerHTML = CATS.map(([k, l]) =>
    `<button class="${ui.cat === k ? 'on' : ''}" data-cat="${k}">${l}<sup>${catCount[k]}</sup></button>`).join('');
  el.sort.value = ui.sort;

  const q = ui.q.trim().toLowerCase();
  let list = live.filter(i => i.status === ui.status && i.category === ui.cat && (!q || i.title.toLowerCase().includes(q)));
  const sorts = {
    added:   (a, b) => b.addedAt - a.addedAt,
    watched: (a, b) => (b.watchedAt || 0) - (a.watchedAt || 0),
    title:   (a, b) => a.title.localeCompare(b.title),
    year:    (a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0),
    mine:    (a, b) => (avg(b.ratings) ?? -1) - (avg(a.ratings) ?? -1),
    imdb:    (a, b) => (parseFloat(b.omdb && b.omdb.imdbRating) || 0) - (parseFloat(a.omdb && a.omdb.imdbRating) || 0)
  };
  list.sort(sorts[ui.sort] || sorts.added);

  el.grid.innerHTML = list.map(it => {
    const mine = avg(it.ratings), im = real(it.omdb && it.omdb.imdbRating) ? it.omdb.imdbRating : null;
    const sub = ui.status === 'watched'
      ? `${esc(it.year)} · ${mine != null ? 'Mine ' + mine.toFixed(1) : 'Unrated'}${im ? ' · IMDb ' + esc(im) : ''}`
      : `${esc(it.year)}${im ? ' · IMDb ' + esc(im) : ''}`;
    return `<article class="card" data-id="${esc(it.id)}">
      <div class="poster">${poster(it)}</div>
      <h3>${esc(it.title)}</h3><p class="sub">${sub}</p>
      ${ui.status === 'watchlist' ? `<button class="ghost" data-watch="${esc(it.id)}">Mark as watched</button>` : ''}
    </article>`;
  }).join('');

  el.empty.hidden = list.length > 0;
  if (!list.length) el.empty.textContent = q ? 'Nothing matches.' : `No ${catLabel(ui.cat).toLowerCase()} in your ${ui.status} yet.`;
  store('cd_ui', { status: ui.status, cat: ui.cat, sort: ui.sort });
}

el.statusTabs.onclick = e => { const b = e.target.closest('[data-status]'); if (b) { ui.status = b.dataset.status; render(); } };
el.catTabs.onclick    = e => { const b = e.target.closest('[data-cat]');    if (b) { ui.cat = b.dataset.cat; render(); } };
el.filter.oninput = e => { ui.q = e.target.value; render(); };
el.sort.onchange  = e => { ui.sort = e.target.value; render(); };
el.grid.onclick = e => {
  const w = e.target.closest('[data-watch]');
  if (w) { setWatched(w.dataset.watch, true); toast('Marked as watched'); return; }
  const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id);
};
function setWatched(id, on) {
  const it = items.find(i => i.id === id); if (!it) return;
  it.status = on ? 'watched' : 'watchlist';
  if (on) it.watchedAt = Date.now();
  touch(it); render();
}

/* ───────── modal plumbing ───────── */
function openModal(html, narrow) {
  el.panel.className = 'panel' + (narrow ? ' narrow' : '');
  el.panel.innerHTML = `<button class="x" data-close aria-label="Close">×</button>` + html;
  el.modal.hidden = false; el.modal.scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeModal() { el.modal.hidden = true; el.panel.innerHTML = ''; document.body.style.overflow = ''; render(); }
el.modal.addEventListener('mousedown', e => { if (e.target === el.modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el.modal.hidden) closeModal(); });
el.panel.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

/* ───────── detail view ───────── */
function openDetail(id) {
  const it = items.find(i => i.id === id && !i.deleted); if (!it) return;
  const d = it.omdb || {};
  const facts = [['Director', d.Director], ['Writer', d.Writer], ['Cast', d.Actors], ['Language', d.Language], ['Country', d.Country], ['Awards', d.Awards],
                 ['Seasons', d.totalSeasons], ['Released', d.Released], ['Category', catLabel(it.category)]].filter(([, v]) => real(v));
  const orig = [];
  if (real(d.imdbRating)) orig.push(['IMDb', d.imdbRating + '/10']);
  (d.Ratings || []).forEach(r => { if (r.Source !== 'Internet Movie Database') orig.push([r.Source, r.Value]); });
  const meta = [it.year, d.Rated, d.Runtime, it.type === 'series' ? 'Series' : 'Film'].filter(real).join(' · ');
  const a = avg(it.ratings);

  openModal(`
  <div class="detail">
    <div class="dposter"><div class="poster">${poster(it)}</div></div>
    <div class="dinfo">
      <h2>${esc(it.title)}</h2>
      <p class="sub2">${esc(meta)}${real(d.Genre) ? '<br>' + esc(d.Genre) : ''}</p>
      ${real(d.Plot) ? `<p class="plot">${esc(d.Plot)}</p>` : ''}
      <dl>${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>

      <h4>Original ratings</h4>
      <div class="chips">${orig.length ? orig.map(([s, v]) => `<div class="chip"><b>${esc(v)}</b><span>${esc(s)}</span></div>`).join('') : '<span class="note">No ratings available.</span>'}</div>

      <h4>My rating</h4>
      ${ASPECTS.map(([k, l]) => { const v = it.ratings && it.ratings[k]; return `
        <div class="rate"><label for="r_${k}">${l}</label>
          <input id="r_${k}" type="range" min="0" max="10" step="0.5" value="${v ?? 5}" data-k="${k}" class="${v == null ? 'unset' : ''}">
          <output>${v == null ? '–' : v}</output></div>`; }).join('')}
      <div class="avg"><b id="avg">${a == null ? '–' : a.toFixed(1)}</b><span>/ 10 average</span>
        <button class="linkbtn" id="clearRatings" style="margin-left:auto">Clear</button></div>

      <div class="actions">
        <button class="btn ${it.status === 'watchlist' ? 'solid' : 'soft'}" id="toggleWatched">${it.status === 'watchlist' ? 'Mark as watched' : 'Move to watchlist'}</button>
        <select class="field" id="moveCat" title="Change category">${CATS.map(([k, l]) => `<option value="${k}" ${k === it.category ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn soft danger" id="removeIt" style="margin-left:auto">Remove</button>
      </div>
    </div>
  </div>`);

  el.panel.querySelectorAll('input[type=range]').forEach(inp => inp.oninput = () => {
    const k = inp.dataset.k; it.ratings = it.ratings || {}; it.ratings[k] = parseFloat(inp.value);
    inp.classList.remove('unset'); inp.nextElementSibling.textContent = inp.value;
    const n = avg(it.ratings); $('#avg').textContent = n == null ? '–' : n.toFixed(1);
    touch(it);
  });
  $('#clearRatings').onclick = () => { it.ratings = {}; touch(it); openDetail(id); };
  $('#toggleWatched').onclick = () => { setWatched(id, it.status === 'watchlist'); openDetail(id); };
  $('#moveCat').onchange = e => { it.category = e.target.value; it.type = catType(it.category); touch(it); toast('Moved to ' + catLabel(it.category)); };
  $('#removeIt').onclick = () => { if (confirm(`Remove “${it.title}” from your diary?`)) { it.deleted = true; touch(it); closeModal(); } };
}

/* ───────── add / search ───────── */
let add = { cat: 'movie', q: '', page: 1, results: [], total: 0, msg: '' };
function openAdd() {
  if (!settings.omdbKey) { toast('Add your OMDb API key first'); return openSettings(); }
  add = { cat: ui.cat, q: '', page: 1, results: [], total: 0, msg: '' };
  openModal(`
    <h2>Add to diary</h2>
    <div class="pills" id="addCats">${CATS.map(([k, l]) => `<button data-c="${k}" class="${k === add.cat ? 'on' : ''}">${l}</button>`).join('')}</div>
    <form class="sform" id="sform"><input class="field" id="aq" placeholder="Search title…" autocomplete="off"><button class="btn solid" type="submit">Search</button></form>
    <div id="results"></div>`);
  $('#aq').focus();
  $('#addCats').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; add.cat = b.dataset.c;
    el.panel.querySelectorAll('#addCats button').forEach(x => x.classList.toggle('on', x === b));
    if ($('#aq').value.trim()) runSearch(false); };
  $('#sform').onsubmit = e => { e.preventDefault(); runSearch(false); };
  $('#results').onclick = onResultClick;
}
async function runSearch(more) {
  const q = more ? add.q : $('#aq').value.trim(); if (!q) return;
  if (!more) { add.q = q; add.page = 1; add.results = []; } else add.page++;
  add.msg = 'Searching…'; renderResults();
  try {
    const d = await omdb({ s: add.q, type: catType(add.cat), page: add.page });
    if (d.Response === 'True') { add.results.push(...d.Search); add.total = +d.totalResults; add.msg = ''; }
    else { add.msg = d.Error || 'No results.'; if (more) add.page--; }
  } catch { add.msg = 'Network error — check your connection.'; if (more) add.page--; }
  renderResults();
}
function renderResults() {
  const box = $('#results'); if (!box) return;
  const rows = add.results.map(r => {
    const have = items.find(i => i.id === r.imdbID && !i.deleted);
    const p = real(r.Poster) ? `<img src="${esc(r.Poster)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '';
    return `<div class="res"><div class="poster">${p}</div>
      <div><div class="t">${esc(r.Title)}</div><div class="y">${esc(r.Year)}</div></div>
      <div class="btns">${have ? `<span class="have">In ${have.status === 'watched' ? 'Watched' : 'Watchlist'} · ${esc(catLabel(have.category))}</span>`
        : `<button data-add="${esc(r.imdbID)}" data-st="watchlist">+ Watchlist</button><button data-add="${esc(r.imdbID)}" data-st="watched">+ Watched</button>`}</div></div>`;
  }).join('');
  box.innerHTML = rows + (add.msg ? `<p class="msg">${esc(add.msg)}</p>` : '') +
    (add.results.length && add.results.length < add.total && !add.msg ? `<button class="btn soft more" data-more>Load more</button>` : '');
}
async function onResultClick(e) {
  if (e.target.closest('[data-more]')) return runSearch(true);
  const b = e.target.closest('[data-add]'); if (!b) return;
  b.disabled = true; b.textContent = 'Adding…';
  try {
    const d = await omdb({ i: b.dataset.add, plot: 'full' });
    if (d.Response !== 'True') throw new Error(d.Error);
    const old = items.find(i => i.id === d.imdbID);
    const now = Date.now();
    const it = { id: d.imdbID, title: d.Title, year: d.Year, poster: real(d.Poster) ? d.Poster : '', type: catType(add.cat), category: add.cat,
                 status: b.dataset.st, omdb: d, ratings: old && old.ratings || {}, addedAt: now, watchedAt: b.dataset.st === 'watched' ? now : null, updatedAt: now };
    if (old) items[items.indexOf(old)] = it; else items.push(it);
    persist(); render(); renderResults(); toast(`Added to ${b.dataset.st === 'watched' ? 'Watched' : 'Watchlist'}`);
  } catch (err) { toast('Could not add: ' + (err.message || 'error')); renderResults(); }
}
el.addBtn.onclick = openAdd;

/* ───────── settings ───────── */
function openSettings() {
  openModal(`
  <h2>Settings</h2>
  <div class="set">
    ${location.protocol === 'file:' ? `<div class="warn">You opened this file directly. Google sign-in needs a local server — see README (run <code>python3 -m http.server 8080</code> and open http://localhost:8080).</div>` : ''}
    <label>OMDb API key</label>
    <input class="field" id="sKey" value="${esc(settings.omdbKey)}" placeholder="e.g. a1b2c3d4" autocomplete="off">
    <p class="note">Free key at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener">omdbapi.com/apikey.aspx</a></p>

    <label>Google OAuth Client ID</label>
    <input class="field" id="sClient" value="${esc(settings.clientId)}" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <p class="note">Web-application client with Drive API enabled. Authorised JavaScript origin: <b>${esc(location.origin === 'null' ? 'http://localhost:8080' : location.origin)}</b></p>

    <div class="actions">
      <button class="btn solid" id="sSave">Save</button>
      ${driveOn() ? `<button class="btn soft" id="sDisc">Disconnect Drive</button>` : `<button class="btn" id="sConn">Save &amp; connect Drive</button>`}
    </div>
    <div class="actions" style="border:0;margin-top:0;padding-top:0">
      <button class="linkbtn" id="sExp">Export JSON</button>
      <button class="linkbtn" id="sImp">Import JSON</button>
      <input type="file" id="sFile" accept="application/json" hidden>
    </div>
  </div>`, true);
  const save = () => { settings = { omdbKey: $('#sKey').value.trim(), clientId: $('#sClient').value.trim() }; store('cd_settings', settings); tokenClient = null; };
  $('#sSave').onclick = () => { save(); toast('Saved'); };
  if ($('#sConn')) $('#sConn').onclick = () => { save(); connectDrive(); closeModal(); };
  if ($('#sDisc')) $('#sDisc').onclick = () => { disconnectDrive(); closeModal(); };
  $('#sExp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'cine-diary', version: 1, items }, null, 2)], { type: 'application/json' }));
    a.download = 'cine-diary-backup.json'; a.click();
  };
  $('#sImp').onclick = () => $('#sFile').click();
  $('#sFile').onchange = async e => {
    try { const j = JSON.parse(await e.target.files[0].text()); items = merge(items, j.items || []); persist(); render(); toast('Imported'); }
    catch { toast('Invalid file'); }
  };
}
el.setBtn.onclick = openSettings;

/* ───────── boot ───────── */
render();
setSync(driveOn() ? 'saving' : 'off');
window.addEventListener('load', () => {
  if (driveOn()) { let n = 0; const t = setInterval(() => { if ((window.google && google.accounts) || ++n > 20) { clearInterval(t); pull(); } }, 250); }
  if (!settings.omdbKey && !items.length) openSettings();
});
</script>
</body>
</html>
